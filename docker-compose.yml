services:

  backend:

    build:
      context: ./backend

    container_name: ai-jobhunter-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

  postgres:

    image: postgres:17

    container_name: ai-jobhunter-db

    restart: always

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:

    image: redis:8

    container_name: ai-jobhunter-redis

    restart: always

    ports:
      - "6379:6379"

volumes:

  postgres_data: